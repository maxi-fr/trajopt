[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajopt"
version = "0.1.0"
description = "Fast optimal control, and trajectory optimization in Python with JAX"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Max Frankenberg", email = "frankenbergmax57@gmail.com"}
]
dependencies = [
    "equinox>=0.11.0",
    "jax>=0.4.25",
    "jaxlib>=0.4.25",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
solvers = [
    "cyipopt>=1.3.0",
    "osqp>=0.6.2",
    "clarabel>=0.6.0",
]
test = [
    "juliacall>=0.9.19",
]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0.0",
    "ty>=0.0.73",
    "validate-pyproject>=0.26",
    "marimo>=0.23.8",
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trajopt"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "julia: tests requiring Julia runtime and juliacall cross-verification (deselect with '-m \"not julia\"')",
]

[tool.uv]
no-build-isolation-package = ["cyipopt"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["trajopt_jl"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "FIX",    # for comments like TODO, FIXME
    "TD",     # for structure of TODO comments
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "PGH003", # Use specific rule codes when ignoring type issues (simplified for ty)
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Single line implicit string concatenation (conflicts with formatter)
    "N806",
    "N803",
    "CPY",     # Missing copyright notices at top of file
]

[tool.ruff.lint.isort]
# Ensures imports are grouped logically
known-first-party = ["trajopt"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# "scripts/**" = [
#     "INP001", # Not a package — standalone runnable demos
#     "T201",   # print() is fine in CLI scripts
# ]
"docs/**" = [
    "INP001", # Reference implementations for the spec, not an importable package
]
"examples/**" = [
    "INP001",  # Not a package
    "B018",    # Useless expression (Marimo displays last expression)
    "ANN",     # Missing type annotations in example cell signatures
    "PLR0913", # Too many arguments in cell definitions
    "PLR0917", # Too many positional arguments in cell definitions
    "N803",    # Argument name check (since we inject Dynamics/Output classes as cell arguments)
    "D",       # Ignore docstrings in examples
    "T201",    # print() is fine in examples
    "N807",    # Function name starting and ending with __ (standard in Marimo)
    "PLC0415", # Imports inside functions (standard in Marimo cells)
    "RET501",  # Redundant return statements (Marimo requires them, Ruff tries to remove them)
    "PLR1711", # Useless return statement at end of function (Marimo requires them, Ruff tries to remove them)
    "F821",    # Undefined name (Marimo cells use reactive arguments)
    "PLR2004", # Magic value comparisons (sweep parameters, thresholds in examples)
    "RUF001",  # Ambiguous unicode characters (emojis in examples UI)
    "PLR0915", # Too many statements (complex layout and plotting code in cells)
    "C901",    # Too complex (conditional logic for selecting stages in examples)
    "PLR0912", # Too many branches (conditional validation switches in examples)
]
"test/**" = [
    "S101",    # assert
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "F401",    # unused import
    "ARG001",  # Unused function args (fixtures)
    "ARG002",  # Unused method args in test mocks
    "PLR2004", # Magic value used in comparison
    "D",       # Ignore docstrings in tests
    "INP001",  # No __init__.py in tests folder
    "ANN",     # Type annotations in tests
    "PLC0415", # Import inside test / fixture
    "N813",    # Camelcase imported as lowercase
    "BLE001",  # Broad exception in fixture skip
    "TRY300",  # Return inside try
    "PTH",     # Pathlib rules in tests
    "E402",    # Module level import not at top of file
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["trajopt_jl/**", "examples/**"]

[tool.ty.rules]

invalid-assignment = "error"
invalid-argument-type = "error"
invalid-return-type = "error"
unresolved-import = "error"
unresolved-attribute = "error"
unresolved-reference = "error"

possibly-missing-import = "error"
unused-ignore-comment = "warn"
unused-type-ignore-comment = "warn"
ignore-comment-unknown-rule = "warn"

index-out-of-bounds = "error"
division-by-zero = "error"
not-iterable = "error"
not-subscriptable = "error"

[[tool.ty.overrides]]
include = ["examples/**"]
rules = { unresolved-reference = "ignore" }

[dependency-groups]
dev = [
    "casadi>=3.7.2",
    "pre-commit>=4.6.2",
]
